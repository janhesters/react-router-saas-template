name: Pull Request

on:
  push:
    branches:
      - main
      - dev
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  oxlint:
    name: ⬣ Oxlint
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: 🧰 Setup toolchain
        uses: ./.github/actions/setup

      - name: 🔬 Lint
        run: bun run check:lint

  shadcn:
    name: 🧩 shadcn rules
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: 🧰 Setup toolchain
        uses: ./.github/actions/setup

      - name: 🧩 Verify shadcn rule enforcement
        run: bun run check:shadcn

  oxfmt:
    name: 💅 Oxfmt
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: 🧰 Setup toolchain
        uses: ./.github/actions/setup

      - name: 💅 Check formatting
        run: bun run check:format

  type-check:
    name: ʦ TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: 🧰 Setup toolchain
        uses: ./.github/actions/setup

      - name: 🔎 Type check
        run: bun run typecheck

  commitlint:
    name: ⚙️ commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: ⚙️ commitlint
        uses: wagoid/commitlint-github-action@v6

  vitest:
    name: ⚡ Vitest
    runs-on: ubuntu-latest
    # Composite actions cannot declare services, so this block stays duplicated
    # in the Playwright job below.
    services:
      postgres:
        image: postgres:18-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: react_router_saas_test
          POSTGRES_INITDB_ARGS: --auth=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: 🧰 Setup toolchain
        uses: ./.github/actions/setup

      - name: 🐘 Setup test database
        uses: ./.github/actions/setup-test-database

      - name: ⚡ Run vitest
        run: bun run test -- --coverage

  playwright-chrome:
    name: 🎭 Playwright Chrome
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: react_router_saas_test
          POSTGRES_INITDB_ARGS: --auth=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: 🧰 Setup toolchain
        uses: ./.github/actions/setup

      - name: 🐘 Setup test database
        uses: ./.github/actions/setup-test-database

      - name: 🌐 Install Playwright Browsers
        run: bunx playwright install --with-deps chromium

      - name: 🏗️ Build application
        run: bun run build

      - name: 🎭 Playwright Run Chrome
        run: bun run test:e2e -- --project=chromium

      - name: 📸 Playwright Screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  docker:
    name: 🐳 Docker
    runs-on: ubuntu-latest
    # No toolchain setup: the Dockerfile runs its own `bun install`, and
    # `.dockerignore` excludes `node_modules`, so the runner's install would
    # never reach the image.
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: 🏗️ Build image
        run: docker build --tag react-router-saas-template:ci .

      - name: 🔎 Verify runtimes
        run: |
          test "$(docker run --rm --entrypoint node react-router-saas-template:ci --version)" = "v24.19.0"
          test "$(docker run --rm --entrypoint bun react-router-saas-template:ci --version)" = "1.4.0"
          docker run --rm \
            --env DATABASE_URL=postgresql://prisma:prisma@localhost:5432/prisma \
            --entrypoint ./node_modules/.bin/prisma \
            react-router-saas-template:ci --version
