name: Pull Request

on:
  push:
    branches:
      - main
      - dev
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: ⬣ Biome
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: 📥 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🛠️ Typegen
        run: bun run typegen

      - name: 🔬 Lint
        run: bun run lint

  type-check:
    name: ʦ TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: 📥 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🔎 Type check
        run: bun run typecheck

  commitlint:
    name: ⚙️ commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ⚙️ commitlint
        uses: wagoid/commitlint-github-action@v6

  vitest:
    name: ⚡ Vitest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: react_router_saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: 📥 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🏄 Copy test env vars
        run: cp .env.example .env

      - name: 🛠 Setup Database
        run: bun run test:db:reset

      - name: 🛠️ Typegen
        run: bun run typegen

      - name: ⚡ Run vitest
        run: bun run test -- --coverage

  playwright-chrome:
    name: 🎭 Playwright Chrome
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: react_router_saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: 📥 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🏄 Copy test env vars
        run: cp .env.example .env

      - name: 🌐 Install Playwright Browsers
        run: bunx playwright install --with-deps chromium

      - name: 🛠 Setup Database
        run: bun run test:db:reset

      - name: 🛠️ Typegen
        run: bun run typegen

      - name: 🏗️ Build application
        run: bun run build

      - name: 🎭 Playwright Run Chrome
        run: bun run test:e2e -- --project=chromium

      - name: 📸 Playwright Screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  docker:
    name: 🐳 Docker
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 🏗️ Build image
        run: docker build --tag react-router-saas-template:ci .

      - name: 🔎 Verify runtimes
        run: |
          test "$(docker run --rm --entrypoint node react-router-saas-template:ci --version)" = "v26.7.0"
          test "$(docker run --rm --entrypoint bun react-router-saas-template:ci --version)" = "1.4.0"
          docker run --rm \
            --env DATABASE_URL=postgresql://prisma:prisma@localhost:5432/prisma \
            --entrypoint ./node_modules/.bin/prisma \
            react-router-saas-template:ci --version
